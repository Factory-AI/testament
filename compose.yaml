name: testament

services:
  postgres:
    image: postgres:17.11-bookworm@sha256:84560e3b9c6874893fc4e2854f5dc3e7c1a37bc9d1dfd7a8c641310ae22ba5ad
    environment:
      POSTGRES_DB: testament
      POSTGRES_USER: testament
      POSTGRES_PASSWORD: testament-local-development-only
      PGPORT: "5440"
    ports:
      - "127.0.0.1:${TESTAMENT_POSTGRES_PORT:-5440}:5440"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testament -d testament -p 5440"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    stop_grace_period: 10s
    volumes:
      - testament-postgres-data:/var/lib/postgresql/data

volumes:
  testament-postgres-data:
    name: testament-postgres-data
