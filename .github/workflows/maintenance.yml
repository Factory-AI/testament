name: Maintenance

on:
  schedule:
    - cron: '11 5 * * 1'
  workflow_dispatch:
    inputs:
      record:
        description: Maintenance record to reconcile
        required: true
        type: choice
        options:
          - all
          - trademark-review
          - single-maintainer-bootstrap
          - documentation-freshness
        default: all

permissions:
  contents: read
  issues: write

jobs:
  reconcile:
    name: Maintenance / reconcile
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reconcile owned deduplicated records
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RECORD: ${{ inputs.record || 'all' }}
        run: |
          if [ "$RECORD" = "all" ]; then
            python3 scripts/maintenance_issues.py trademark-review
            python3 scripts/maintenance_issues.py single-maintainer-bootstrap
            python3 scripts/maintenance_issues.py documentation-freshness
          else
            python3 scripts/maintenance_issues.py "$RECORD"
          fi
