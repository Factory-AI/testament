name: Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 2'
  workflow_dispatch:
    inputs:
      deliberate_failure:
        description: Emit the safe VAL-READY-028 failure
        required: false
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

jobs:
  gates:
    name: Quality / gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Run declared quality and readiness gates
        env:
          DELIBERATE_FAILURE: ${{ inputs.deliberate_failure || 'false' }}
        run: |
          arguments=()
          if [ "$DELIBERATE_FAILURE" = "true" ]; then
            arguments+=(--deliberate-failure)
          fi
          python3 scripts/run_ci_gates.py \
            --artifact remote-ci-result.json \
            "${arguments[@]}"
      - name: Upload bounded machine-readable result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-result-${{ github.run_id }}
          path: remote-ci-result.json
          if-no-files-found: error
          retention-days: 14
